<!doctype html>
<html><head><meta charset="utf-8"><title>Metro Tiles</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:720px;height:450px;overflow:hidden;background:#E6E8EB;font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;color:#000;position:relative}
.col{position:absolute;display:flex;flex-direction:column;gap:20px}
.hit{width:340px;height:56px;background:#fff;display:flex;align-items:stretch;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.ic{width:56px;background:#000;flex:none}
.txt{flex:1;font-size:30px;font-weight:300;line-height:56px;padding-left:12px;white-space:nowrap;overflow:hidden;letter-spacing:-.5px}
.t{width:84px;flex:none;color:#fff;font-size:22px;font-weight:600;display:flex;align-items:flex-end;justify-content:flex-start;padding:0 0 6px 8px;background:#60A917}
.t.p{background:#F0A30A}
.t.red{background:#E51400}
.preview{position:absolute;left:372px;top:58px}
.row{width:340px;height:44px;font-size:22px;font-weight:300;padding-left:68px;line-height:44px;white-space:nowrap;overflow:hidden}
.cap{position:absolute;font-size:12px;color:#555;font-weight:400}
</style></head><body>
<div class="cap" style="left:24px;top:32px">静止 · 倒计时 · 暂停 · 到时</div>
<div class="col" style="left:24px;top:58px">
  <div class="hit"><span class="ic"></span><span class="txt">写第三章：实验设计</span></div>
  <div class="hit"><span class="ic" style="background:#1BA1E2"></span><span class="txt">回复王老师的修改意见</span><span class="t">42:18</span></div>
  <div class="hit"><span class="ic"></span><span class="txt">番茄钟 整理参考文献</span><span class="t p">18:20</span></div>
  <div class="hit"><span class="ic"></span><span class="txt">发版前跑一遍 e2e</span><span class="t red">00:00</span></div>
</div>
<div class="cap" style="left:372px;top:32px">悬停 · 磁贴翻转</div>
<div class="preview">
  <div class="row" style="opacity:.25">买牛奶和鸡蛋</div>
  <div class="row" style="opacity:.55">10:30 组会，带上周数据</div>
  <div class="hit"><span class="ic" style="background:#1BA1E2"></span><span class="txt">回复王老师的修改意见</span><span class="t">42:18</span></div>
  <div class="row" style="opacity:.55">提交本月报销单</div>
  <div class="row" style="opacity:.25">给房东发水电读数</div>
</div>
</body></html>
