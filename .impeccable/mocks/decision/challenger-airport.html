<!doctype html>
<html><head><meta charset="utf-8"><title>Terminal Yellow</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:720px;height:450px;overflow:hidden;background:#E6E8EB;font-family:"Segoe UI Variable Text","Segoe UI",sans-serif;color:#111;position:relative}
.col{position:absolute;display:flex;flex-direction:column;gap:20px}
.hit{width:340px;height:52px;background:#FFD200;display:flex;align-items:center;gap:12px;padding:0 0 0 8px;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.fill{position:absolute;left:0;bottom:0;height:6px;background:#111}
.ic{width:36px;height:36px;background:#111;flex:none;display:flex;align-items:center;justify-content:center}
.ic i{width:16px;height:16px;border:3px solid #fff;border-radius:50%}
.txt{flex:1;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden}
.t{height:52px;min-width:84px;background:#111;color:#fff;font-family:Bahnschrift,sans-serif;font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center}
.t.p{background:#5A5A5A}
.t.red{background:#D52B1E}
.preview{position:absolute;left:372px;top:58px}
.row{width:340px;height:48px;display:flex;align-items:center;gap:12px;padding-left:8px;background:#FFE666;margin-bottom:2px}
.row .txt{font-weight:500}
.cap{position:absolute;font-size:11px;letter-spacing:1.2px;color:#555;font-weight:700}
</style></head><body>
<div class="cap" style="left:24px;top:34px">静止 · 倒计时 · 暂停 · 到时</div>
<div class="col" style="left:24px;top:58px">
  <div class="hit"><span class="ic"><i></i></span><span class="txt">写第三章：实验设计</span></div>
  <div class="hit"><span class="fill" style="width:62%"></span><span class="ic"><i></i></span><span class="txt">回复王老师的修改意见</span><span class="t">42:18</span></div>
  <div class="hit"><span class="ic"><i></i></span><span class="txt">番茄钟 · 整理参考文献</span><span class="t p">18:20</span></div>
  <div class="hit"><span class="ic"><i></i></span><span class="txt">发版前跑一遍 e2e</span><span class="t red">00:00</span></div>
</div>
<div class="cap" style="left:372px;top:34px">悬停 · 下一步</div>
<div class="preview">
  <div class="row" style="opacity:.3"><span class="ic"><i></i></span><span class="txt">买牛奶和鸡蛋</span></div>
  <div class="row" style="opacity:.6"><span class="ic"><i></i></span><span class="txt">10:30 组会，带上周数据</span></div>
  <div class="hit" style="margin-bottom:2px"><span class="ic"><i></i></span><span class="txt">回复王老师的修改意见</span><span class="t">42:18</span></div>
  <div class="row" style="opacity:.6"><span class="ic"><i></i></span><span class="txt">提交本月报销单</span></div>
  <div class="row" style="opacity:.3"><span class="ic"><i></i></span><span class="txt">给房东发水电读数</span></div>
</div>
</body></html>
