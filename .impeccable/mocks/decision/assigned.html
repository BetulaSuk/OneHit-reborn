<!doctype html>
<html><head><meta charset="utf-8"><title>Platform Clock</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:720px;height:450px;overflow:hidden;background:#E6E8EB;font-family:"Segoe UI Variable Text","Segoe UI",sans-serif;color:#141414;position:relative}
.desk{position:absolute;inset:0;background:linear-gradient(#EEF0F2,#E3E6E9)}
.ghost{position:absolute;background:#F7F8F9;border:1px solid #D9DCE0;border-radius:6px}
.col{position:absolute;display:flex;flex-direction:column;gap:20px}
.hit{width:320px;height:52px;background:#fff;border:1px solid #BFC4CA;border-radius:10px;display:flex;align-items:center;padding:0 14px 0 8px;gap:12px;position:relative;overflow:hidden;box-shadow:0 1px 0 #fff inset,0 6px 18px rgba(20,20,20,.10)}
.fill{position:absolute;left:0;top:0;bottom:0;background:#D7EFDF}
.fill.amber{background:#F6E6BF}
.hit.ended{border-color:#D52B1E;box-shadow:0 0 0 2px rgba(213,43,30,.18),0 6px 18px rgba(20,20,20,.10)}
.disc{width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid #141414;position:relative;flex:none;z-index:1}
.disc:before{content:"";position:absolute;left:50%;top:3px;width:3px;height:9px;margin-left:-1.5px;background:#141414}
.disc:after{content:"";position:absolute;left:50%;top:50%;width:2px;height:13px;margin:-12px 0 0 -1px;background:#D52B1E;transform:rotate(40deg);transform-origin:50% 100%}
.disc.img{background:#2B3A4A;border-color:#2B3A4A}
.disc.img:before,.disc.img:after{display:none}
.txt{flex:1;font-size:15px;font-weight:600;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
.time{font-family:Bahnschrift,"DIN Alternate",sans-serif;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;z-index:1;letter-spacing:.5px}
.time.red{color:#D52B1E}
.tag{font-size:11px;font-weight:700;letter-spacing:1px;color:#6B7178;z-index:1;text-transform:uppercase}
.preview{position:absolute;left:372px;top:58px;display:flex;flex-direction:column;align-items:flex-start}
.row{width:320px;height:52px;display:flex;align-items:center;gap:12px;padding:0 14px 0 8px}
.row .txt{font-weight:500}
.add{width:320px;height:44px;border:2px dashed #2E9A5C;border-radius:10px;color:#2E9A5C;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.cap{position:absolute;font-size:11px;letter-spacing:1.2px;color:#7A8088;font-weight:700;text-transform:uppercase}
</style></head><body>
<div class="desk"></div>
<div class="ghost" style="left:-20px;top:300px;width:330px;height:190px"></div>
<div class="ghost" style="left:420px;top:-30px;width:340px;height:70px"></div>

<div class="cap" style="left:28px;top:34px">静止 · 倒计时 · 暂停 · 到时</div>
<div class="col" style="left:28px;top:58px">
  <div class="hit"><span class="disc"></span><span class="txt">写第三章：实验设计</span><span class="tag">下沉 0</span></div>
  <div class="hit"><span class="fill" style="width:62%"></span><span class="disc img"></span><span class="txt">回复王老师的修改意见</span><span class="time">42:18</span></div>
  <div class="hit"><span class="fill amber" style="width:35%"></span><span class="disc"></span><span class="txt">番茄钟 · 整理参考文献</span><span class="time">18:20</span></div>
  <div class="hit ended"><span class="disc"></span><span class="txt">发版前跑一遍 e2e</span><span class="time red">00:00</span></div>
</div>

<div class="cap" style="left:372px;top:34px">悬停 · 上下预览</div>
<div class="preview">
  <div class="row" style="opacity:.25"><span class="disc"></span><span class="txt">买牛奶和鸡蛋</span></div>
  <div class="row" style="opacity:.55"><span class="disc"></span><span class="txt">10:30 组会，带上周数据</span><span class="time" style="font-size:16px">1:05</span></div>
  <div class="hit"><span class="fill" style="width:62%"></span><span class="disc img"></span><span class="txt">回复王老师的修改意见</span><span class="time">42:18</span></div>
  <div class="row" style="opacity:.55"><span class="disc"></span><span class="txt">提交本月报销单</span></div>
  <div class="row" style="opacity:.25"><span class="disc"></span><span class="txt">给房东发水电读数</span></div>
  <div class="add">+</div>
</div>
</body></html>
